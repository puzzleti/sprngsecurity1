server:
  port: 8088

logging:
  pattern:
    console: ${LOGPATTERN_CONSOLE:%green(%d{yyyy-MM-dd HH:mm:ss}) %red(%-5level) %yellow(%logger{15}) - %blue(%msg%n)}

spring:
  application:
    name: ${SPRING_APP_NAME:sprngsecurity1}
  security:
    user:
      name: ${SECURITY_USERNAME:admin}
      password: ${SECURITY_PASSWORD:admin123}

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
